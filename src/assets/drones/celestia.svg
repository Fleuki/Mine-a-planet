<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 320" width="256" height="320">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6feff"/>
      <stop offset="0.5" stop-color="#cfeef5"/>
      <stop offset="1" stop-color="#8fb9c6"/>
    </linearGradient>
    <linearGradient id="cone" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5f6a7c"/>
      <stop offset="0.5" stop-color="#eef8fb"/>
      <stop offset="1" stop-color="#5f6a7c"/>
    </linearGradient>
    <radialGradient id="eye" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.35" stop-color="#7df9ff"/>
      <stop offset="1" stop-color="rgba(125,249,255,0.15)"/>
    </radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- neon halo -->
  <circle cx="128" cy="120" r="96" fill="none" stroke="#7df9ff" stroke-width="6" opacity="0.85" filter="url(#glow)"/>

  <!-- celestial crown -->
  <g fill="#e2ffff" filter="url(#glow)">
    <path d="M128 20 l10 26 -20 0 z"/>
    <path d="M92 30 l8 24 -18 2 z"/>
    <path d="M164 30 l-8 24 18 2 z"/>
  </g>

  <!-- side pods -->
  <g fill="#aeccd4">
    <rect x="44" y="92" width="34" height="70" rx="16"/>
    <rect x="178" y="92" width="34" height="70" rx="16"/>
  </g>
  <g fill="#7df9ff" filter="url(#glow)">
    <circle cx="61" cy="127" r="8"/><circle cx="195" cy="127" r="8"/>
  </g>

  <!-- head -->
  <rect x="62" y="66" width="132" height="112" rx="40" fill="url(#body)" stroke="#7df9ff" stroke-width="3"/>
  <rect x="86" y="74" width="84" height="18" rx="9" fill="#ffffff" opacity="0.35"/>

  <!-- visor + eyes -->
  <rect x="76" y="104" width="104" height="52" rx="24" fill="#101a26" opacity="0.94"/>
  <ellipse cx="108" cy="130" rx="16" ry="20" fill="url(#eye)"/>
  <ellipse cx="148" cy="130" rx="16" ry="20" fill="url(#eye)"/>

  <!-- jaw trim -->
  <rect x="62" y="162" width="132" height="16" rx="8" fill="#7df9ff"/>

  <!-- drill -->
  <rect x="108" y="176" width="40" height="20" rx="6" fill="#9aa7ba"/>
  <path d="M96 196 L160 196 L128 300 Z" fill="url(#cone)"/>
  <g stroke="#7df9ff" stroke-width="6" opacity="0.85">
    <line x1="96" y1="214" x2="160" y2="206"/>
    <line x1="100" y1="240" x2="156" y2="232"/>
    <line x1="108" y1="266" x2="148" y2="258"/>
  </g>
  <circle cx="128" cy="300" r="9" fill="#ffffff" filter="url(#glow)"/>
</svg>
